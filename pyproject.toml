[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-operations-ai-agent"
version = "0.1.0"
description = "Rental operations API and explainable agent workflow demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1.0", "ruff>=0.4,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
